name: Temporary Batch 003 Materialization

on:
  push:
    branches:
      - fix/batch003-generated-materialization
    paths:
      - '.github/workflows/tmp-batch003-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/batch003-generated-materialization
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize canonical content
        run: npm run compile:content

      - name: Commit deterministic generated outputs
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(#158): materialize tracked batch 003 generated outputs'
          git push origin HEAD:fix/batch003-generated-materialization
