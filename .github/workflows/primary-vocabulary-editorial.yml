name: Primary Vocabulary Editorial Packets

on:
  pull_request:
    branches: [kidsplay]
    paths:
      - '.github/workflows/primary-vocabulary-editorial.yml'
      - 'content/lexicon/open/curator-slices/grade-1-meaning-review.json'
      - 'content/lexicon/open/curator-slices/grade-2-meaning-review.json'
      - 'content/lexicon/editorial-packets/**'
      - 'content/lexicon/ai-draft-overlays/**'
      - 'content/lexicon/reviews/**'
      - 'content/knowledge/english-vocabulary-primary-reviewed.json'
      - 'scripts/lexicon/prepare-primary-vocabulary-editorial-packet.mjs'
      - 'scripts/lexicon/apply-primary-vocabulary-ai-draft-overlay.mjs'
      - 'scripts/lexicon/finalize-primary-vocabulary-editorial-packet.mjs'
      - 'scripts/lexicon/import-primary-vocabulary-reviews.mjs'
      - 'tests/primary-vocabulary-editorial-packets.behavior.test.ts'
      - 'tests/primary-vocabulary-ai-draft-overlays.behavior.test.ts'
      - 'tests/primary-vocabulary-human-review.behavior.test.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-validate:
    name: Generate Grade 1-2 editorial packets
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Linux native bindings omitted by cross-platform lockfile
        shell: bash
        run: |
          set -euo pipefail
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          TARBALL="$(npm pack --silent --pack-destination /tmp "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}" | tail -n 1)"
          mkdir -p node_modules/@rolldown/binding-linux-x64-gnu
          tar -xzf "/tmp/${TARBALL}" -C node_modules/@rolldown/binding-linux-x64-gnu --strip-components=1
          LIGHTNING_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          LIGHTNING_TARBALL="$(npm pack --silent --pack-destination /tmp "lightningcss-linux-x64-gnu@${LIGHTNING_VERSION}" | tail -n 1)"
          mkdir -p node_modules/lightningcss-linux-x64-gnu
          tar -xzf "/tmp/${LIGHTNING_TARBALL}" -C node_modules/lightningcss-linux-x64-gnu --strip-components=1
          node -e "require('@rolldown/binding-linux-x64-gnu'); require('lightningcss')"

      - name: Generate prioritized Grade 1 and Grade 2 packets
        run: |
          npm run lexicon:prepare:editorial:grade1
          npm run lexicon:prepare:editorial:grade2

      - name: Apply bounded AI draft overlays
        run: |
          npm run lexicon:apply:ai-draft -- --packet content/lexicon/editorial-packets/grade-1-batch-001.json --overlay content/lexicon/ai-draft-overlays/grade-1-batch-001-ai-draft-001.json --output content/lexicon/editorial-packets/grade-1-batch-001.ai-draft.json
          npm run lexicon:apply:ai-draft -- --packet content/lexicon/editorial-packets/grade-2-batch-001.json --overlay content/lexicon/ai-draft-overlays/grade-2-batch-001-ai-draft-001.json --output content/lexicon/editorial-packets/grade-2-batch-001.ai-draft.json

      - name: Assert packets and AI drafts remain blocked and unreviewed
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const grade of [1, 2]) {
            const packet = JSON.parse(readFileSync(`content/lexicon/editorial-packets/grade-${grade}-batch-001.json`, 'utf8'));
            const drafted = JSON.parse(readFileSync(`content/lexicon/editorial-packets/grade-${grade}-batch-001.ai-draft.json`, 'utf8'));
            if (packet.summary.words !== 40 || drafted.summary.words !== 40) throw new Error(`Grade ${grade}: expected 40 prioritized words`);
            if (packet.policy.publicationState !== 'blocked_pending_editorial_review') throw new Error(`Grade ${grade}: packet must remain blocked`);
            if (packet.policy.requiredReviewAuthority !== 'human_editor') throw new Error(`Grade ${grade}: human editorial authority must be required`);
            if (drafted.summary.aiDraftSuggestions !== 8 || drafted.aiDraftOverlay.suggestionsApplied !== 8) throw new Error(`Grade ${grade}: expected 8 bounded AI draft suggestions`);
            for (const item of drafted.items) {
              if (item.editorial.status !== 'draft' || item.editorial.decision !== null || item.editorial.selectedCandidateId !== null || item.editorial.reviewAuthority !== null) throw new Error(`${item.lemma}: AI draft changed editorial review state`);
              if (item.profilePlacement.status !== 'unreviewed' || item.profilePlacement.approvedProfileRefs.length !== 0) throw new Error(`${item.lemma}: profile placement was inferred`);
              if (!item.candidateSenses.length || item.candidateSenses.some((candidate) => candidate.referenceOnly !== true)) throw new Error(`${item.lemma}: candidate reference boundary failed`);
              if (item.aiDraft && (item.aiDraft.mayCountAsReviewed !== false || item.aiDraft.humanReviewRequired !== true || item.aiDraft.profilePlacementApproved !== false)) throw new Error(`${item.lemma}: AI draft crossed editorial boundary`);
            }
          }
          NODE

      - name: Import accepted human review decisions
        run: |
          npm run lexicon:import:reviews
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const knowledge = JSON.parse(readFileSync('content/knowledge/english-vocabulary-primary-reviewed.json', 'utf8'));
          const entries = knowledge[0]?.entries ?? [];
          if (entries.length !== 16) throw new Error(`Expected exactly 16 reviewed vocabulary rows, got ${entries.length}`);
          if (entries.filter((entry) => entry.meta?.primaryVocabularyGrade === 1).length !== 8) throw new Error('Expected 8 Grade 1 reviewed rows');
          if (entries.filter((entry) => entry.meta?.primaryVocabularyGrade === 2).length !== 8) throw new Error('Expected 8 Grade 2 reviewed rows');
          for (const entry of entries) {
            if (entry.meta?.curation?.status !== 'reviewed') throw new Error(`${entry.id}: expected reviewed curation state`);
            if (entry.meta?.curation?.reviewer !== 'sahnishant') throw new Error(`${entry.id}: expected sahnishant reviewer identity`);
            if (entry.meta?.curation?.reviewedAt !== '2026-08-31') throw new Error(`${entry.id}: expected 2026-08-31 review date`);
            if (entry.meta?.curation?.sourceGlossCopied !== false) throw new Error(`${entry.id}: source gloss copy boundary failed`);
          }
          NODE
          git diff --exit-code -- content/knowledge/english-vocabulary-primary-reviewed.json

      - name: Run focused vocabulary acceptance suite
        run: |
          npm run test:vocabulary-corpus
          npx vitest run tests/primary-vocabulary-human-review.behavior.test.ts

      - name: Upload editorial packets and reviewed import proof
        uses: actions/upload-artifact@v7
        with:
          name: primary-vocabulary-editorial-grade1-2
          path: |
            content/lexicon/editorial-packets/grade-1-batch-001.json
            content/lexicon/editorial-packets/grade-2-batch-001.json
            content/lexicon/editorial-packets/grade-1-batch-001.ai-draft.json
            content/lexicon/editorial-packets/grade-2-batch-001.ai-draft.json
            content/lexicon/reviews/grade-1-batch-001.json
            content/lexicon/reviews/grade-2-batch-001.json
            content/knowledge/english-vocabulary-primary-reviewed.json
          if-no-files-found: error
