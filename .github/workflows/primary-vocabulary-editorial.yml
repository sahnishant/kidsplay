name: Primary Vocabulary Editorial Packets

on:
  pull_request:
    branches: [kidsplay]
    paths:
      - '.github/workflows/primary-vocabulary-editorial.yml'
      - 'content/lexicon/open/curator-slices/grade-1-meaning-review.json'
      - 'content/lexicon/open/curator-slices/grade-2-meaning-review.json'
      - 'content/lexicon/editorial-packets/**'
      - 'scripts/lexicon/prepare-primary-vocabulary-editorial-packet.mjs'
      - 'scripts/lexicon/finalize-primary-vocabulary-editorial-packet.mjs'
      - 'tests/primary-vocabulary-editorial-packets.behavior.test.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-validate:
    name: Generate Grade 1-2 editorial packets
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate prioritized Grade 1 and Grade 2 packets
        run: |
          npm run lexicon:prepare:editorial:grade1
          npm run lexicon:prepare:editorial:grade2

      - name: Assert packets remain blocked and unreviewed
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const grade of [1, 2]) {
            const packet = JSON.parse(readFileSync(`content/lexicon/editorial-packets/grade-${grade}-batch-001.json`, 'utf8'));
            if (packet.summary.words !== 40) throw new Error(`Grade ${grade}: expected 40 prioritized words`);
            if (packet.policy.publicationState !== 'blocked_pending_editorial_review') throw new Error(`Grade ${grade}: packet must remain blocked`);
            if (packet.policy.requiredReviewAuthority !== 'human_editor') throw new Error(`Grade ${grade}: human editorial authority must be required`);
            for (const item of packet.items) {
              if (item.editorial.status !== 'draft' || item.editorial.reviewAuthority !== null) throw new Error(`${item.lemma}: item was pre-reviewed`);
              if (item.profilePlacement.approvedProfileRefs.length !== 0) throw new Error(`${item.lemma}: profile placement was inferred`);
              if (!item.candidateSenses.length || item.candidateSenses.some((candidate) => candidate.referenceOnly !== true)) throw new Error(`${item.lemma}: candidate reference boundary failed`);
            }
          }
          NODE

      - name: Run focused vocabulary acceptance suite
        run: npm run test:vocabulary-corpus

      - name: Upload editorial packets
        uses: actions/upload-artifact@v7
        with:
          name: primary-vocabulary-editorial-grade1-2
          path: |
            content/lexicon/editorial-packets/grade-1-batch-001.json
            content/lexicon/editorial-packets/grade-2-batch-001.json
          if-no-files-found: error
