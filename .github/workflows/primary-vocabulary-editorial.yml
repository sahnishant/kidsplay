name: Primary Vocabulary Editorial Packets

on:
  pull_request:
    branches: [kidsplay, main]
    paths:
      - '.github/workflows/primary-vocabulary-editorial.yml'
      - 'content/lexicon/open/curator-slices/grade-1-meaning-review.json'
      - 'content/lexicon/open/curator-slices/grade-2-meaning-review.json'
      - 'content/lexicon/open/curator-slices/grade-1-meaning-review-080.json'
      - 'content/lexicon/open/curator-slices/grade-2-meaning-review-080.json'
      - 'content/lexicon/open/review-wordlists/**'
      - 'content/lexicon/open/sense-review/**'
      - 'content/lexicon/editorial-packets/**'
      - 'content/lexicon/ai-draft-overlays/**'
      - 'content/lexicon/reviews/**'
      - 'content/knowledge/english-vocabulary-primary-reviewed*.json'
      - 'content/learnables/primary-vocabulary-reviewed*.json'
      - 'content/recipes/primary-vocabulary-reviewed-delivery-*.json'
      - 'content/packs/free-vocabulary.json'
      - 'content/profile-memberships/CBSE_INDIA_CLASS1.json'
      - 'content/profile-memberships/CISCE_INDIA_CLASS1.json'
      - 'content/profile-memberships/CBSE_INDIA_CLASS2.json'
      - 'content/profile-memberships/CISCE_INDIA_CLASS2.json'
      - 'content/profile-memberships/SOF_INDIA_CLASS2.json'
      - 'scripts/compile-knowledge.mjs'
      - 'scripts/lexicon/export-primary-vocabulary-sense-slice.mjs'
      - 'scripts/lexicon/materialize-primary-vocabulary-review-delivery.mjs'
      - 'scripts/lexicon/prepare-primary-vocabulary-editorial-packet.mjs'
      - 'scripts/lexicon/apply-primary-vocabulary-ai-draft-overlay.mjs'
      - 'scripts/lexicon/finalize-primary-vocabulary-editorial-packet.mjs'
      - 'scripts/lexicon/import-primary-vocabulary-reviews.mjs'
      - 'tests/primary-vocabulary-*.behavior.test.ts'
      - 'tests/vocabulary-reviewed-*.behavior.test.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-validate:
    name: Generate and certify reviewed vocabulary batches
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Linux native bindings omitted by cross-platform lockfile
        shell: bash
        run: |
          set -euo pipefail
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          TARBALL="$(npm pack --silent --pack-destination /tmp "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}" | tail -n 1)"
          mkdir -p node_modules/@rolldown/binding-linux-x64-gnu
          tar -xzf "/tmp/${TARBALL}" -C node_modules/@rolldown/binding-linux-x64-gnu --strip-components=1
          LIGHTNING_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          LIGHTNING_TARBALL="$(npm pack --silent --pack-destination /tmp "lightningcss-linux-x64-gnu@${LIGHTNING_VERSION}" | tail -n 1)"
          mkdir -p node_modules/lightningcss-linux-x64-gnu
          tar -xzf "/tmp/${LIGHTNING_TARBALL}" -C node_modules/lightningcss-linux-x64-gnu --strip-components=1
          node -e "require('@rolldown/binding-linux-x64-gnu'); require('lightningcss')"

      - name: Regenerate blocked Grade 1 and Grade 2 editorial packets through batch 004
        run: |
          npm run lexicon:prepare:editorial:grade1
          npm run lexicon:prepare:editorial:grade2
          npm run lexicon:prepare:editorial -- --slice content/lexicon/open/curator-slices/grade-1-meaning-review.json --output content/lexicon/editorial-packets/grade-1-batch-002.json --batch-id grade-1-batch-002 --limit 16 --exclude-reviews content/lexicon/reviews/grade-1-batch-001.json --profile-targets CBSE_INDIA_CLASS1,CISCE_INDIA_CLASS1
          npm run lexicon:prepare:editorial -- --slice content/lexicon/open/curator-slices/grade-2-meaning-review.json --output content/lexicon/editorial-packets/grade-2-batch-002.json --batch-id grade-2-batch-002 --limit 16 --exclude-reviews content/lexicon/reviews/grade-2-batch-001.json --profile-targets CBSE_INDIA_CLASS2,CISCE_INDIA_CLASS2,SOF_INDIA_CLASS2
          npm run lexicon:prepare:editorial -- --slice content/lexicon/open/curator-slices/grade-1-meaning-review.json --output content/lexicon/editorial-packets/grade-1-batch-003.json --batch-id grade-1-batch-003 --limit 16 --exclude-reviews content/lexicon/reviews/grade-1-batch-001.json,content/lexicon/reviews/grade-1-batch-002.json --profile-targets CBSE_INDIA_CLASS1,CISCE_INDIA_CLASS1
          npm run lexicon:prepare:editorial -- --slice content/lexicon/open/curator-slices/grade-2-meaning-review.json --output content/lexicon/editorial-packets/grade-2-batch-003.json --batch-id grade-2-batch-003 --limit 16 --exclude-reviews content/lexicon/reviews/grade-2-batch-001.json,content/lexicon/reviews/grade-2-batch-002.json --profile-targets CBSE_INDIA_CLASS2,CISCE_INDIA_CLASS2,SOF_INDIA_CLASS2
          npm run lexicon:export:review-slice -- --sense-review content/lexicon/open/sense-review/grade-1-introduced-meaning-oewn.json --wordlist content/lexicon/open/review-wordlists/grade-1-introduced-meaning.json --output content/lexicon/open/curator-slices/grade-1-meaning-review-080.json --limit 80
          npm run lexicon:export:review-slice -- --sense-review content/lexicon/open/sense-review/grade-2-introduced-meaning-oewn.json --wordlist content/lexicon/open/review-wordlists/grade-2-introduced-meaning.json --output content/lexicon/open/curator-slices/grade-2-meaning-review-080.json --limit 80
          npm run lexicon:prepare:editorial -- --slice content/lexicon/open/curator-slices/grade-1-meaning-review-080.json --output content/lexicon/editorial-packets/grade-1-batch-004.json --batch-id grade-1-batch-004 --limit 16 --exclude-reviews content/lexicon/reviews/grade-1-batch-001.json,content/lexicon/reviews/grade-1-batch-002.json,content/lexicon/reviews/grade-1-batch-003.json --profile-targets CBSE_INDIA_CLASS1,CISCE_INDIA_CLASS1
          npm run lexicon:prepare:editorial -- --slice content/lexicon/open/curator-slices/grade-2-meaning-review-080.json --output content/lexicon/editorial-packets/grade-2-batch-004.json --batch-id grade-2-batch-004 --limit 16 --exclude-reviews content/lexicon/reviews/grade-2-batch-001.json,content/lexicon/reviews/grade-2-batch-002.json,content/lexicon/reviews/grade-2-batch-003.json --profile-targets CBSE_INDIA_CLASS2,CISCE_INDIA_CLASS2,SOF_INDIA_CLASS2
          git diff --exit-code -- \
            content/lexicon/open/curator-slices/grade-1-meaning-review-080.json \
            content/lexicon/open/curator-slices/grade-2-meaning-review-080.json \
            content/lexicon/editorial-packets/grade-1-batch-004.json \
            content/lexicon/editorial-packets/grade-2-batch-004.json

      - name: Keep AI drafts blocked from human authority
        run: |
          npm run lexicon:apply:ai-draft -- --packet content/lexicon/editorial-packets/grade-1-batch-001.json --overlay content/lexicon/ai-draft-overlays/grade-1-batch-001-ai-draft-001.json --output content/lexicon/editorial-packets/grade-1-batch-001.ai-draft.json
          npm run lexicon:apply:ai-draft -- --packet content/lexicon/editorial-packets/grade-2-batch-001.json --overlay content/lexicon/ai-draft-overlays/grade-2-batch-001-ai-draft-001.json --output content/lexicon/editorial-packets/grade-2-batch-001.ai-draft.json
          npm run lexicon:apply:ai-draft -- --packet content/lexicon/editorial-packets/grade-1-batch-003.json --overlay content/lexicon/ai-draft-overlays/grade-1-batch-003-ai-draft-001.json --output content/lexicon/editorial-packets/grade-1-batch-003.ai-draft.json
          npm run lexicon:apply:ai-draft -- --packet content/lexicon/editorial-packets/grade-2-batch-003.json --overlay content/lexicon/ai-draft-overlays/grade-2-batch-003-ai-draft-001.json --output content/lexicon/editorial-packets/grade-2-batch-003.ai-draft.json
          npm run lexicon:apply:ai-draft -- --packet content/lexicon/editorial-packets/grade-1-batch-004.json --overlay content/lexicon/ai-draft-overlays/grade-1-batch-004-ai-draft-001.json --output content/lexicon/editorial-packets/grade-1-batch-004.ai-draft.json
          npm run lexicon:apply:ai-draft -- --packet content/lexicon/editorial-packets/grade-2-batch-004.json --overlay content/lexicon/ai-draft-overlays/grade-2-batch-004-ai-draft-001.json --output content/lexicon/editorial-packets/grade-2-batch-004.ai-draft.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const proofs = [
            { grade: 1, batch: '001', suggestions: 8, intentionallyUndrafted: [] },
            { grade: 2, batch: '001', suggestions: 8, intentionallyUndrafted: [] },
            { grade: 1, batch: '003', suggestions: 13, intentionallyUndrafted: ['experience', 'natural', 'once'] },
            { grade: 2, batch: '003', suggestions: 15, intentionallyUndrafted: ['appear'] },
            { grade: 1, batch: '004', suggestions: 12, intentionallyUndrafted: ['earth', 'well', 'move', 'long'] },
            { grade: 2, batch: '004', suggestions: 13, intentionallyUndrafted: ['region', 'sun', 'subject'] }
          ];
          for (const proof of proofs) {
            const path = `content/lexicon/editorial-packets/grade-${proof.grade}-batch-${proof.batch}.ai-draft.json`;
            const drafted = JSON.parse(readFileSync(path, 'utf8'));
            if (drafted.policy.publicationState !== 'blocked_pending_editorial_review') throw new Error(`${path}: packet must remain blocked`);
            const intentionallyUndrafted = new Set(proof.intentionallyUndrafted);
            if (proof.batch !== '001' && drafted.aiDraftOverlay?.suggestionsApplied !== proof.suggestions) throw new Error(`${path}: wrong suggestion count`);
            for (const item of drafted.items) {
              if (item.editorial.status !== 'draft' || item.editorial.reviewAuthority !== null || item.editorial.selectedCandidateId !== null) throw new Error(`${item.lemma}: AI draft changed human review state`);
              if (item.profilePlacement.approvedProfileRefs.length !== 0) throw new Error(`${item.lemma}: AI draft inferred profile placement`);
              if (intentionallyUndrafted.has(item.lemma) && item.aiDraft != null) throw new Error(`${item.lemma}: intentionally undrafted item received a suggestion`);
            }
          }
          NODE

      - name: Reproduce all accepted human-review knowledge batches
        run: |
          npm run lexicon:import:reviews
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const reviews = new Map();
          for (const name of readdirSync('content/lexicon/reviews').filter((entry) => /^grade-\d+-batch-\d+\.json$/.test(entry)).sort()) {
            const document = JSON.parse(readFileSync(join('content/lexicon/reviews', name), 'utf8'));
            const batch = /^grade-\d+-batch-(\d+)$/.exec(document.batchId)?.[1]?.padStart(3, '0');
            if (!batch) throw new Error(`${name}: invalid production batchId`);
            const bucket = reviews.get(batch) ?? new Map();
            for (const decision of document.decisions ?? []) {
              if (decision.status !== 'reviewed' || decision.decision !== 'accept') continue;
              if (decision.reviewAuthority !== 'human_editor') throw new Error(`${name}/${decision.lemma}: human_editor authority required`);
              if (bucket.has(decision.lemma)) throw new Error(`${batch}/${decision.lemma}: duplicate accepted lemma`);
              bucket.set(decision.lemma, decision);
            }
            reviews.set(batch, bucket);
          }
          const globallySeen = new Set();
          for (const [batch, expected] of [...reviews].sort()) {
            const path = batch === '001'
              ? 'content/knowledge/english-vocabulary-primary-reviewed.json'
              : `content/knowledge/english-vocabulary-primary-reviewed-batch-${batch}.json`;
            const knowledge = JSON.parse(readFileSync(path, 'utf8'));
            const entries = knowledge[0]?.entries ?? [];
            if (entries.length !== expected.size) throw new Error(`${batch}: expected ${expected.size} rows, got ${entries.length}`);
            if (knowledge[0]?.id !== `knowledge.english.vocabulary.primary-reviewed.${batch}`) throw new Error(`${batch}: wrong source id`);
            for (const entry of entries) {
              const decision = expected.get(entry.id);
              if (!decision) throw new Error(`${batch}/${entry.id}: runtime row lacks accepted review`);
              if (globallySeen.has(entry.id)) throw new Error(`${entry.id}: accepted in more than one production batch`);
              globallySeen.add(entry.id);
              if (entry.meta?.curation?.candidateId !== decision.candidateId) throw new Error(`${entry.id}: candidate mismatch`);
              if (entry.object?.label !== decision.childDefinition) throw new Error(`${entry.id}: child definition mismatch`);
              if (entry.meta?.curation?.reviewer !== decision.reviewer || entry.meta?.curation?.reviewedAt !== decision.reviewedAt) throw new Error(`${entry.id}: reviewer metadata mismatch`);
              if (entry.meta?.curation?.sourceGlossCopied !== false) throw new Error(`${entry.id}: source gloss boundary failed`);
            }
          }
          if (globallySeen.size !== 78) throw new Error(`Expected 78 reviewed runtime meanings across batches 001-003, got ${globallySeen.size}`);
          const batch3 = JSON.parse(readFileSync('content/knowledge/english-vocabulary-primary-reviewed-batch-003.json', 'utf8'))[0]?.entries ?? [];
          if (batch3.length !== 32) throw new Error(`Expected 32 batch-003 rows, got ${batch3.length}`);
          const expectedSenses = new Map([['experience','experience#n#3'],['natural','natural#a#2'],['once','once#r#1'],['appear','appear#v#2']]);
          for (const [lemma, candidateId] of expectedSenses) {
            const row = batch3.find((entry) => entry.id === lemma);
            if (row?.meta?.curation?.candidateId !== candidateId) throw new Error(`${lemma}: expected ${candidateId}`);
          }
          NODE
          git diff --exit-code -- content/knowledge/english-vocabulary-primary-reviewed.json content/knowledge/english-vocabulary-primary-reviewed-batch-002.json

      - name: Compile and run vocabulary production acceptance suite
        run: |
          npm run test:vocabulary-corpus
          npx vitest run tests/primary-vocabulary-editorial-batch-002.behavior.test.ts tests/primary-vocabulary-editorial-batch-003.behavior.test.ts tests/primary-vocabulary-editorial-batch-004.behavior.test.ts tests/vocabulary-reviewed-batch-002-production.behavior.test.ts tests/vocabulary-reviewed-batch-003-production.behavior.test.ts tests/vocabulary-reviewed-concept-trace.behavior.test.ts

      - name: Upload editorial and reviewed production proof
        uses: actions/upload-artifact@v7
        with:
          name: primary-vocabulary-editorial-grade1-2
          path: |
            content/lexicon/open/curator-slices/grade-1-meaning-review-080.json
            content/lexicon/open/curator-slices/grade-2-meaning-review-080.json
            content/lexicon/editorial-packets/grade-1-batch-001.json
            content/lexicon/editorial-packets/grade-2-batch-001.json
            content/lexicon/editorial-packets/grade-1-batch-002.json
            content/lexicon/editorial-packets/grade-2-batch-002.json
            content/lexicon/editorial-packets/grade-1-batch-003.json
            content/lexicon/editorial-packets/grade-2-batch-003.json
            content/lexicon/editorial-packets/grade-1-batch-003.ai-draft.json
            content/lexicon/editorial-packets/grade-2-batch-003.ai-draft.json
            content/lexicon/editorial-packets/grade-1-batch-004.json
            content/lexicon/editorial-packets/grade-2-batch-004.json
            content/lexicon/editorial-packets/grade-1-batch-004.ai-draft.json
            content/lexicon/editorial-packets/grade-2-batch-004.ai-draft.json
            content/lexicon/reviews/grade-1-batch-001.json
            content/lexicon/reviews/grade-2-batch-001.json
            content/lexicon/reviews/grade-1-batch-001-profile-placements.json
            content/lexicon/reviews/grade-2-batch-001-profile-placements.json
            content/lexicon/reviews/grade-1-batch-002.json
            content/lexicon/reviews/grade-2-batch-002.json
            content/lexicon/reviews/grade-1-batch-003.json
            content/lexicon/reviews/grade-2-batch-003.json
            content/knowledge/english-vocabulary-primary-reviewed.json
            content/knowledge/english-vocabulary-primary-reviewed-batch-002.json
            content/knowledge/english-vocabulary-primary-reviewed-batch-003.json
            content/learnables/primary-vocabulary-reviewed-batch-003.json
            content/recipes/primary-vocabulary-reviewed-delivery-batch-003.json
          if-no-files-found: error
