name: Temporary vocabulary runtime projection sync

on:
  push:
    branches:
      - integration/semantic-depth-v6-current-main-review
    paths:
      - '.github/workflows/temp-sync-vocabulary-runtime.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          ref: integration/semantic-depth-v6-current-main-review
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compile reviewed batches
        run: npm run compile:vocabulary-visual-batches

      - name: Compile exact runtime projection
        run: node scripts/compile-vocabulary-visual-runtime.mjs

      - name: Commit exact generated projection and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/vocabulary-visuals/__generated-runtime-plans.json
          git rm .github/workflows/temp-sync-vocabulary-runtime.yml
          git diff --cached -- content/vocabulary-visuals/__generated-runtime-plans.json
          if git diff --cached --quiet -- content/vocabulary-visuals/__generated-runtime-plans.json; then
            echo "Runtime compiler produced no tracked projection change"
            exit 1
          fi
          git commit -m "build(integration): sync same-sense runtime projection"
          git push origin HEAD:integration/semantic-depth-v6-current-main-review
