name: Resolve Primary Vocabulary Senses

on:
  push:
    branches:
      - content/primary-vocabulary-corpus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primary-vocabulary-resolve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve/backfill grade meaning queues against OEWN
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Linux Rolldown binding omitted by cross-platform lockfile
        shell: bash
        run: |
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          npm install --no-save --package-lock=false "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}"

      - name: Download pinned Open English WordNet 2025 JSON
        shell: bash
        run: |
          mkdir -p /tmp/oewn
          curl --fail --location --retry 5 --retry-delay 2 \
            --output /tmp/oewn/english-wordnet-2025-json.zip \
            https://github.com/globalwordnet/english-wordnet/releases/download/2025-edition/english-wordnet-2025-json.zip
          echo "7d749f6e2c39e6970e4997839dcf6e42fd281f3c2fae0171d2192bae8cfa4b51  /tmp/oewn/english-wordnet-2025-json.zip" | sha256sum --check --strict
          unzip -q /tmp/oewn/english-wordnet-2025-json.zip -d /tmp/oewn/unpacked
          ENTRY_SHARDS="$(find /tmp/oewn/unpacked -maxdepth 1 -type f -name 'entries-*.json' | wc -l | tr -d ' ')"
          SYNSET_SHARDS="$(find /tmp/oewn/unpacked -maxdepth 1 -type f \( -name 'noun.*.json' -o -name 'verb.*.json' -o -name 'adj.*.json' -o -name 'adv.*.json' \) | wc -l | tr -d ' ')"
          echo "OEWN JSON shards: ${ENTRY_SHARDS} lexical-entry files, ${SYNSET_SHARDS} synset files"
          if [ "$ENTRY_SHARDS" -lt 1 ] || [ "$SYNSET_SHARDS" -lt 1 ]; then
            echo "Official OEWN JSON archive did not contain the expected sharded entry/synset layout" >&2
            exit 1
          fi
          echo "OEWN_INPUT=/tmp/oewn/unpacked" >> "$GITHUB_ENV"

      - name: Build OEWN-resolvable grade meaning queues
        shell: bash
        run: |
          rm -rf content/lexicon/open/sense-review
          mkdir -p content/lexicon/open/sense-review content/lexicon/open/review-wordlists
          find content/lexicon/open/review-wordlists -maxdepth 1 -type f -name 'grade-*-introduced-meaning.json' -delete
          npm run lexicon:resolve:primary -- \
            --input "$OEWN_INPUT" \
            --corpus content/lexicon/open/primary-grade-corpus.json \
            --source-version 2025 \
            --max-senses 3 \
            --mode introduced \
            --target-per-grade 400 \
            --overscan-per-grade 1200

      - name: Validate sense-review provenance
        run: npm run validate:lexicon-senses

      - name: Build curator profile slices from finalized meaning queues
        shell: bash
        run: |
          rm -rf content/lexicon/open/profile-slices
          mkdir -p content/lexicon/open/profile-slices
          while IFS=: read -r PROFILE GRADE; do
            npm run lexicon:profile-slice:primary -- \
              --profile "$PROFILE" \
              --grade "$GRADE" \
              --limit 100 \
              --wordlist "content/lexicon/open/review-wordlists/grade-${GRADE}-introduced-meaning.json"
          done <<'EOF'
          CBSE_INDIA_CLASS1:1
          CBSE_INDIA_CLASS2:2
          CISCE_INDIA_CLASS1:1
          CISCE_INDIA_CLASS2:2
          SOF_INDIA_CLASS2:2
          SOF_INDIA_CLASS3:3
          SOF_INDIA_CLASS4:4
          SOF_INDIA_CLASS5:5
          SOF_INDIA_CLASS6:6
          EOF

      - name: Verify profile slices are review-only artifacts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const directory = resolve('content/lexicon/open/profile-slices');
          const files = readdirSync(directory).filter((name) => name.endsWith('.json')).sort();
          if (files.length !== 9) throw new Error(`Expected 9 primary profile slices, found ${files.length}`);
          for (const filename of files) {
            const slice = JSON.parse(readFileSync(resolve(directory, filename), 'utf8'));
            if (slice.status !== 'curation_review_only') throw new Error(`${filename}: invalid status`);
            const policy = slice.policy ?? {};
            if (policy.runtimeContent !== false || policy.mutatesKnowledge !== false || policy.mutatesProfileMembership !== false) {
              throw new Error(`${filename}: profile slice can never be runtime/mutating content`);
            }
            if (policy.sourceDefinitionsIncluded !== false || policy.sourceExamplesIncluded !== false || policy.boardAlignmentClaimed !== false) {
              throw new Error(`${filename}: source prose/alignment claim leaked into profile slice policy`);
            }
            if (slice.sourceSelection?.purpose !== 'meaning') throw new Error(`${filename}: expected meaning source selection`);
            if (!slice.sourceSelection?.semanticResolution) throw new Error(`${filename}: expected finalized OEWN semantic-resolution metadata`);
            if (slice.summary?.selectedCandidates !== slice.sourceSelection?.sliceSelected) throw new Error(`${filename}: slice count mismatch`);
          }
          console.log(`Primary vocabulary profile slices validated: ${files.length}`);
          NODE

      - name: Run vocabulary corpus and delivery acceptance tests
        run: npm run test:vocabulary-corpus

      - name: Run full Kidsplay regression check
        run: npm run check

      - name: Commit meaning queues, sense reviews and profile slices if changed
        shell: bash
        run: |
          git add content/lexicon/open/review-wordlists/grade-*-introduced-meaning.json
          git add content/lexicon/open/sense-review/
          git add content/lexicon/open/profile-slices/
          if git diff --cached --quiet; then
            echo "Meaning queues, sense-review data and profile slices already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: resolve primary vocabulary against OEWN 2025"
          git push origin "HEAD:${GITHUB_REF_NAME}"
