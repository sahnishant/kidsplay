name: Resolve Primary Vocabulary Senses

on:
  push:
    branches:
      - content/primary-vocabulary-corpus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primary-vocabulary-resolve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve meaning queues, curator slices and reviewed imports
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Linux native bindings omitted by cross-platform lockfile
        shell: bash
        run: |
          set -euo pipefail
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          TARBALL="$(npm pack --silent --pack-destination /tmp "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}" | tail -n 1)"
          mkdir -p node_modules/@rolldown/binding-linux-x64-gnu
          tar -xzf "/tmp/${TARBALL}" -C node_modules/@rolldown/binding-linux-x64-gnu --strip-components=1
          LIGHTNING_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          LIGHTNING_TARBALL="$(npm pack --silent --pack-destination /tmp "lightningcss-linux-x64-gnu@${LIGHTNING_VERSION}" | tail -n 1)"
          mkdir -p node_modules/lightningcss-linux-x64-gnu
          tar -xzf "/tmp/${LIGHTNING_TARBALL}" -C node_modules/lightningcss-linux-x64-gnu --strip-components=1
          node -e "require('@rolldown/binding-linux-x64-gnu'); require('lightningcss')"

      - name: Apply deterministic primary grade bands
        run: |
          npm run lexicon:reband:primary
          npm run validate:lexicon-corpus

      - name: Download pinned Open English WordNet 2025 JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oewn
          curl --fail --location --retry 5 --retry-delay 2 \
            --output /tmp/oewn/english-wordnet-2025-json.zip \
            https://github.com/globalwordnet/english-wordnet/releases/download/2025-edition/english-wordnet-2025-json.zip
          echo "7d749f6e2c39e6970e4997839dcf6e42fd281f3c2fae0171d2192bae8cfa4b51  /tmp/oewn/english-wordnet-2025-json.zip" | sha256sum --check --strict
          unzip -q /tmp/oewn/english-wordnet-2025-json.zip -d /tmp/oewn/unpacked
          ENTRY_SHARDS="$(find /tmp/oewn/unpacked -maxdepth 1 -type f -name 'entries-*.json' | wc -l | tr -d ' ')"
          SYNSET_SHARDS="$(find /tmp/oewn/unpacked -maxdepth 1 -type f \( -name 'noun.*.json' -o -name 'verb.*.json' -o -name 'adj.*.json' -o -name 'adv.*.json' \) | wc -l | tr -d ' ')"
          echo "OEWN JSON shards: ${ENTRY_SHARDS} lexical-entry files, ${SYNSET_SHARDS} synset files"
          if [ "$ENTRY_SHARDS" -lt 1 ] || [ "$SYNSET_SHARDS" -lt 1 ]; then
            echo "Official OEWN JSON archive did not contain the expected sharded entry/synset layout" >&2
            exit 1
          fi
          echo "OEWN_INPUT=/tmp/oewn/unpacked" >> "$GITHUB_ENV"

      - name: Build OEWN-resolvable grade meaning queues
        shell: bash
        run: |
          set -euo pipefail
          rm -rf content/lexicon/open/sense-review
          mkdir -p content/lexicon/open/sense-review content/lexicon/open/review-wordlists
          find content/lexicon/open/review-wordlists -maxdepth 1 -type f -name 'grade-*-introduced-meaning.json' -delete
          npm run lexicon:resolve:primary -- \
            --input "$OEWN_INPUT" \
            --corpus content/lexicon/open/primary-grade-corpus.json \
            --source-version 2025 \
            --max-senses 3 \
            --mode introduced \
            --target-per-grade 400 \
            --overscan-per-grade 1200

      - name: Validate sense-review provenance
        run: npm run validate:lexicon-senses

      - name: Export curator-sized sense slices
        shell: bash
        run: |
          set -euo pipefail
          rm -rf content/lexicon/open/curator-slices
          mkdir -p content/lexicon/open/curator-slices
          for GRADE in 1 2 3 4 5 6; do
            npm run lexicon:export:review-slice -- \
              --sense-review "content/lexicon/open/sense-review/grade-${GRADE}-introduced-meaning-oewn.json" \
              --wordlist "content/lexicon/open/review-wordlists/grade-${GRADE}-introduced-meaning.json" \
              --limit 40 \
              --output "content/lexicon/open/curator-slices/grade-${GRADE}-meaning-review.json"
          done

      - name: Import explicit reviewed decisions when present
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'content/lexicon/reviews/*.json' > /dev/null; then
            npm run lexicon:import:reviews
          else
            echo "No explicit human review decisions committed yet; runtime semantic import remains empty."
            rm -f content/knowledge/english-vocabulary-primary-reviewed.json
          fi

      - name: Build curator profile slices from finalized meaning queues
        shell: bash
        run: |
          set -euo pipefail
          rm -rf content/lexicon/open/profile-slices
          mkdir -p content/lexicon/open/profile-slices
          while IFS=: read -r PROFILE GRADE; do
            npm run lexicon:profile-slice:primary -- \
              --profile "$PROFILE" \
              --grade "$GRADE" \
              --limit 100 \
              --wordlist "content/lexicon/open/review-wordlists/grade-${GRADE}-introduced-meaning.json"
          done <<'EOF'
          CBSE_INDIA_CLASS1:1
          CBSE_INDIA_CLASS2:2
          CISCE_INDIA_CLASS1:1
          CISCE_INDIA_CLASS2:2
          SOF_INDIA_CLASS2:2
          SOF_INDIA_CLASS3:3
          SOF_INDIA_CLASS4:4
          SOF_INDIA_CLASS5:5
          SOF_INDIA_CLASS6:6
          EOF

      - name: Verify profile slices stay review-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const directory = resolve('content/lexicon/open/profile-slices');
          const files = readdirSync(directory).filter((name) => name.endsWith('.json')).sort();
          if (files.length !== 9) throw new Error(`Expected 9 primary profile slices, found ${files.length}`);
          for (const filename of files) {
            const slice = JSON.parse(readFileSync(resolve(directory, filename), 'utf8'));
            if (slice.status !== 'curation_review_only') throw new Error(`${filename}: invalid status`);
            const policy = slice.policy ?? {};
            if (policy.runtimeContent !== false || policy.mutatesKnowledge !== false || policy.mutatesProfileMembership !== false) throw new Error(`${filename}: profile slice can never be runtime/mutating content`);
            if (policy.sourceDefinitionsIncluded !== false || policy.sourceExamplesIncluded !== false || policy.boardAlignmentClaimed !== false) throw new Error(`${filename}: source prose/alignment claim leaked into profile slice policy`);
            if (slice.sourceSelection?.purpose !== 'meaning') throw new Error(`${filename}: expected meaning source selection`);
            if (!slice.sourceSelection?.semanticResolution) throw new Error(`${filename}: expected finalized OEWN semantic-resolution metadata`);
            if (slice.summary?.selectedCandidates !== slice.sourceSelection?.sliceSelected) throw new Error(`${filename}: slice count mismatch`);
          }
          console.log(`Primary vocabulary profile slices validated: ${files.length}`);
          NODE

      - name: Verify reviewed semantic import when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f content/knowledge/english-vocabulary-primary-reviewed.json ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const knowledge = JSON.parse(readFileSync("content/knowledge/english-vocabulary-primary-reviewed.json", "utf8"));
              const entries = knowledge.flatMap((set) => set.entries ?? []);
              if (!entries.length) throw new Error("Reviewed semantic import must contain at least one row");
              for (const entry of entries) {
                if (entry.meta?.curation?.status !== "reviewed") throw new Error(entry.rowId + ": missing reviewed curation status");
                if (entry.meta?.curation?.sourceGlossCopied !== false) throw new Error(entry.rowId + ": source gloss must not be copied into child content");
                if (!entry.meta?.curation?.candidateId) throw new Error(entry.rowId + ": missing reviewed OEWN candidate id");
              }
              console.log("Reviewed primary semantic rows validated: " + entries.length);
            '
          else
            echo "No reviewed semantic import generated yet."
          fi

      - name: Run vocabulary acceptance tests
        run: npm run test:vocabulary-corpus

      - name: Run repository-wide merge gate
        run: npm run check

      - name: Commit lane-validated generated artifacts if changed
        shell: bash
        run: |
          set -euo pipefail
          git add content/lexicon/open/primary-grade-corpus.json
          git add content/lexicon/open/review-wordlists/grade-*-introduced-meaning.json
          git add content/lexicon/open/sense-review/
          git add content/lexicon/open/curator-slices/
          git add content/lexicon/open/profile-slices/
          if [ -f content/knowledge/english-vocabulary-primary-reviewed.json ]; then
            git add content/knowledge/english-vocabulary-primary-reviewed.json
          else
            git add -u content/knowledge/english-vocabulary-primary-reviewed.json 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "Meaning queues, review artifacts and reviewed imports already current."
            exit 0
          fi
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "A newer branch head exists; skip persistence because the newer push will rerun this deterministic lane."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: resolve primary vocabulary and refresh curator review slices"
          git push origin "HEAD:${GITHUB_REF_NAME}"
