name: Graph CI Diagnostics
on:
  push:
    branches: ['chore/graph-ci-diagnostics']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize every browser failure without repeated attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/sahnishant/kidsplay/actions/jobs/101432260087/logs > /tmp/browser.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('/tmp/browser.log').read_text(encoding='utf-8-sig')
          source = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', source)
          lines = source.splitlines()
          for i, line in enumerate(lines):
              if re.search(r'\s\d+\) \[chromium\]', line):
                  block = []
                  for candidate in lines[i:i+60]:
                      if 'attachment #' in candidate or 'Retry #1' in candidate:
                          break
                      block.append(candidate)
                  print('\n'.join(block))
              elif re.search(r'\s\d+ (?:failed|passed|flaky)(?:\s|$)', line):
                  print('\n'.join(lines[i:i+20]))
          PY
