name: Graph CI Diagnostics
on:
  push:
    branches: ['chore/graph-ci-diagnostics']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded failure diagnostics from the existing browser run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/sahnishant/kidsplay/actions/jobs/101430899280/logs > /tmp/browser.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('/tmp/browser.log').read_text(encoding='utf-8-sig')
          source = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', source)
          print('\n'.join(source.splitlines()[-240:]))
          PY
