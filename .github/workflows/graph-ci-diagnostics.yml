name: Graph CI Diagnostics
on:
  push:
    branches: ['chore/graph-ci-diagnostics']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact-head browser validation and capture summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/sahnishant/kidsplay/actions/runs/34016561992 --jq '{id,head_sha,status,conclusion}'
          gh api --allow-escape-sequences repos/sahnishant/kidsplay/actions/jobs/101441237428/logs > /tmp/browser.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/browser.log').read_text(encoding='utf-8-sig')
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          for line in text.splitlines():
              if re.search(r'HEAD is now|svelte-check found|Bundle budget validation passed|Test Files |\sTests\s+\d+ passed|Running \d+ tests|\s\d+ (?:passed|failed|flaky) \(|"checkout":|"complete":|"expected":|"captured":|"missing":|Artifact ID', line):
                  print(line)
          PY
