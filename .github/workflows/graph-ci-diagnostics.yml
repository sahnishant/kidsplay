name: Graph CI Diagnostics
on:
  push:
    branches: ['chore/graph-ci-diagnostics']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded failure diagnostics from the existing browser run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/sahnishant/kidsplay/actions/jobs/101430899280/logs > /tmp/browser.log
          tail -n 220 /tmp/browser.log
