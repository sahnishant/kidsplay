name: Graph CI Diagnostics
on:
  push:
    branches: ['chore/graph-ci-diagnostics']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded browser assertion failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/sahnishant/kidsplay/actions/jobs/101432260087/logs > /tmp/browser.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('/tmp/browser.log').read_text(encoding='utf-8-sig')
          source = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', source)
          lines = source.splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if re.search(r'\d+\) \[|Error:|failed|passed|Expected:|Received:|strict mode violation|Test timeout', line) and i > next((j for j, text in enumerate(lines) if 'Run npm run test:e2e:ci' in text), len(lines)):
                  selected.update(range(max(0, i - 3), min(len(lines), i + 25)))
          print('\n'.join(lines[i] for i in sorted(selected))[:45000])
          PY
