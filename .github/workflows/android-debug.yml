name: Android Debug APK

on:
  push:
    branches: [kidsplay]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          LIGHTNINGCSS_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          NATIVE_DIR="$(mktemp -d)"
          npm install --prefix "$NATIVE_DIR" --no-save --package-lock=false --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" \
            "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"
          mkdir -p node_modules/@rolldown
          rm -rf node_modules/@rolldown/binding-linux-x64-gnu node_modules/lightningcss-linux-x64-gnu
          cp -R "$NATIVE_DIR/node_modules/@rolldown/binding-linux-x64-gnu" node_modules/@rolldown/
          cp -R "$NATIVE_DIR/node_modules/lightningcss-linux-x64-gnu" node_modules/
          rm -rf "$NATIVE_DIR"

      - name: Validate content and build web runtime
        run: npm run check

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Install emulator system image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name kidsplay-ci --package "system-images;android-35;google_apis;x86_64"

      - name: Packaged offline relaunch and rotation smoke
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p android-smoke
          emulator -avd kidsplay-ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect >android-smoke/emulator.log 2>&1 &
          adb wait-for-device

          booted=""
          for _ in $(seq 1 72); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 5
          done
          test "$booted" = "1"

          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell svc wifi disable || true
          adb shell svc data disable || true

          launch_and_assert() {
            local label="$1"
            adb shell am force-stop com.kidsplay.app
            adb shell monkey -p com.kidsplay.app -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 4
            adb shell pidof com.kidsplay.app | tee "android-smoke/${label}-pid.txt"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "android-smoke/${label}-ui.xml" >/dev/null
            grep -qi "Kidsplay" "android-smoke/${label}-ui.xml"
            adb exec-out screencap -p > "android-smoke/${label}.png"
          }

          launch_and_assert portrait-offline-first-launch
          launch_and_assert portrait-offline-force-stop-relaunch

          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 3
          adb shell uiautomator dump /sdcard/window-landscape.xml >/dev/null
          adb pull /sdcard/window-landscape.xml android-smoke/landscape-ui.xml >/dev/null
          grep -qi "Kidsplay" android-smoke/landscape-ui.xml
          adb exec-out screencap -p > android-smoke/landscape.png

          adb shell dumpsys package com.kidsplay.app > android-smoke/package.txt
          adb shell dumpsys activity activities > android-smoke/activities.txt

      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kidsplay-android-smoke-diagnostics
          path: android-smoke
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kidsplay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
