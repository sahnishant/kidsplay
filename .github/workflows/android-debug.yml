name: Android Debug APK

on:
  push:
    branches: [kidsplay]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          LIGHTNINGCSS_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          NATIVE_DIR="$(mktemp -d)"
          npm install --prefix "$NATIVE_DIR" --no-save --package-lock=false --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" \
            "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"
          mkdir -p node_modules/@rolldown
          rm -rf node_modules/@rolldown/binding-linux-x64-gnu node_modules/lightningcss-linux-x64-gnu
          cp -R "$NATIVE_DIR/node_modules/@rolldown/binding-linux-x64-gnu" node_modules/@rolldown/
          cp -R "$NATIVE_DIR/node_modules/lightningcss-linux-x64-gnu" node_modules/
          rm -rf "$NATIVE_DIR"

      - name: Validate content and build web runtime
        run: npm run check

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Install emulator system image
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          ANDROID_USER_HOME="$RUNNER_TEMP/kidsplay-android-user"
          ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          rm -rf "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          export ANDROID_USER_HOME ANDROID_AVD_HOME
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name kidsplay-ci --package "system-images;android-35;google_apis;x86_64"
          "$AVDMANAGER" list avd
          test -f "$ANDROID_AVD_HOME/kidsplay-ci.ini"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Packaged offline relaunch and rotation smoke
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p android-smoke
          emulator -avd kidsplay-ci -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader_indirect >android-smoke/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT

          device_ready=""
          for _ in $(seq 1 90); do
            if adb get-state 2>/dev/null | grep -qx device; then
              device_ready="1"
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat android-smoke/emulator.log
              exit 1
            fi
            sleep 2
          done
          test "$device_ready" = "1"

          booted=""
          for _ in $(seq 1 72); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat android-smoke/emulator.log
              exit 1
            fi
            sleep 5
          done
          test "$booted" = "1"

          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell svc wifi disable || true
          adb shell svc data disable || true

          resolve_launcher_component() {
            local component=""
            for _ in $(seq 1 15); do
              component="$(adb shell cmd package resolve-activity --brief \
                -a android.intent.action.MAIN \
                -c android.intent.category.LAUNCHER \
                com.kidsplay.app 2>/dev/null | tr -d '\r' | tail -n 1)"
              if [[ "$component" == com.kidsplay.app/* ]]; then
                printf '%s\n' "$component"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_app_pid() {
            local label="$1"
            local pid=""
            for _ in $(seq 1 15); do
              pid="$(adb shell pidof com.kidsplay.app 2>/dev/null | tr -d '\r')"
              if [ -n "$pid" ]; then
                printf '%s\n' "$pid" | tee "android-smoke/${label}-pid.txt"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          capture_rendered_screen() {
            local label="$1"
            local path="android-smoke/${label}.png"
            local bytes="0"
            for _ in $(seq 1 15); do
              adb exec-out screencap -p > "$path"
              bytes="$(wc -c < "$path" | tr -d ' ')"
              if [ "$bytes" -ge 45000 ]; then
                return 0
              fi
              sleep 2
            done
            echo "Rendered screen remained visually sparse (${bytes} bytes): $label" >&2
            return 1
          }

          dump_portrait_webview() {
            local label="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "android-smoke/${label}-ui.xml" >/dev/null
            grep -q 'package="com.kidsplay.app"' "android-smoke/${label}-ui.xml"
            grep -q 'resource-id="com.kidsplay.app:id/webview"' "android-smoke/${label}-ui.xml"
          }

          launch_and_assert() {
            local label="$1"
            local component=""
            adb shell am force-stop com.kidsplay.app
            component="$(resolve_launcher_component)"
            adb shell am start -W -n "$component" | tee "android-smoke/${label}-launch.txt"
            wait_for_app_pid "$label"
            capture_rendered_screen "$label"
            dump_portrait_webview "$label"
          }

          launch_and_assert portrait-offline-first-launch
          launch_and_assert portrait-offline-force-stop-relaunch

          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1

          landscape_ready=""
          for _ in $(seq 1 15); do
            adb exec-out screencap -p > android-smoke/landscape.png
            bytes="$(wc -c < android-smoke/landscape.png | tr -d ' ')"
            read -r width height <<< "$(python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(24); print(*struct.unpack(">II", d[16:24]))' android-smoke/landscape.png)"
            if [ "$width" -gt "$height" ] && [ "$bytes" -ge 45000 ]; then
              landscape_ready="1"
              break
            fi
            sleep 2
          done
          test "$landscape_ready" = "1"
          adb shell pidof com.kidsplay.app | tee android-smoke/landscape-pid.txt
          adb shell dumpsys package com.kidsplay.app > android-smoke/package.txt
          adb shell dumpsys activity activities > android-smoke/activities.txt
          grep -q 'com.kidsplay.app' android-smoke/activities.txt

      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kidsplay-android-smoke-diagnostics
          path: android-smoke
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kidsplay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
