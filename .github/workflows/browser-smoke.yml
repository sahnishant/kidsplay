name: Browser Smoke

on:
  push:
    branches: [kidsplay, main]
  pull_request:
    branches: [kidsplay, main, feat/reusable-learning-studios-v1]
  workflow_dispatch:

jobs:
  child-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          LIGHTNINGCSS_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          NATIVE_DIR="$(mktemp -d)"
          npm install --prefix "$NATIVE_DIR" --no-save --package-lock=false --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" \
            "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"
          mkdir -p node_modules/@rolldown
          rm -rf node_modules/@rolldown/binding-linux-x64-gnu node_modules/lightningcss-linux-x64-gnu
          cp -R "$NATIVE_DIR/node_modules/@rolldown/binding-linux-x64-gnu" node_modules/@rolldown/
          cp -R "$NATIVE_DIR/node_modules/lightningcss-linux-x64-gnu" node_modules/
          rm -rf "$NATIVE_DIR"

      - name: Install Chromium
        shell: bash
        run: |
          # GitHub's Ubuntu image also carries the Google Chrome apt source. Playwright
          # does not need it, and an out-of-sync Chrome mirror must not block Chromium.
          for source in /etc/apt/sources.list.d/*; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source" 2>/dev/null; then
              sudo rm -f "$source"
            fi
          done
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Chromium dependency install failed on attempt $attempt; refreshing apt metadata before retry."
            sudo rm -rf /var/lib/apt/lists/*
            sleep 10
          done

      - name: Run existing checks
        run: npm run check

      - name: Run browser child journeys
        run: npm run test:e2e:ci

      - name: Assemble exact-checkout illustration contact sheet
        if: always()
        run: node scripts/qa/studio-art-contact-sheet.mjs

      - name: Upload illustration contact sheet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: studio-art-proof/studio-art-contact.png
          archive: false
          if-no-files-found: error

      - name: Upload illustration capture provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: studio-art-proof/studio-art-capture-report.json
          archive: false
          if-no-files-found: error

      - name: Upload studio browser proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: learning-studio-browser-proof
          path: node_modules/.cache/kidsplay-playwright/results/**/studio-*.png
          if-no-files-found: ignore

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-smoke-diagnostics
          path: node_modules/.cache/kidsplay-playwright/results
          if-no-files-found: ignore
