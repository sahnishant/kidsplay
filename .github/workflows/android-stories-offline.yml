name: Android Stories Offline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  stories-airplane-relaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          LIGHTNINGCSS_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          NATIVE_DIR="$(mktemp -d)"
          npm install --prefix "$NATIVE_DIR" --no-save --package-lock=false --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" \
            "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"
          mkdir -p node_modules/@rolldown
          rm -rf node_modules/@rolldown/binding-linux-x64-gnu node_modules/lightningcss-linux-x64-gnu
          cp -R "$NATIVE_DIR/node_modules/@rolldown/binding-linux-x64-gnu" node_modules/@rolldown/
          cp -R "$NATIVE_DIR/node_modules/lightningcss-linux-x64-gnu" node_modules/
          rm -rf "$NATIVE_DIR"

      - name: Build packaged web runtime
        run: npm run build

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Install emulator system image
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          ANDROID_USER_HOME="$RUNNER_TEMP/kidsplay-stories-android-user"
          ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          rm -rf "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          export ANDROID_USER_HOME ANDROID_AVD_HOME
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name kidsplay-stories-ci --package "system-images;android-35;google_apis;x86_64"
          test -f "$ANDROID_AVD_HOME/kidsplay-stories-ci.ini"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Packaged Stories airplane-mode process-relaunch proof
        timeout-minutes: 12
        env:
          KIDSPLAY_ANDROID_AVD: kidsplay-stories-ci
        run: bash qa/android-stories-offline-smoke.sh android-stories-smoke android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Stories Android diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kidsplay-stories-airplane-mode-proof
          path: android-stories-smoke
          if-no-files-found: ignore
