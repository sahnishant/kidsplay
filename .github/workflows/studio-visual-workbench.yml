name: Studio Visual Workbench

on:
  pull_request:
    paths: ['.github/workflows/studio-visual-workbench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare dependencies
        run: |
          npm ci --no-audit --no-fund
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          LIGHTNINGCSS_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          NATIVE_DIR="$(mktemp -d)"
          npm install --prefix "$NATIVE_DIR" --no-save --package-lock=false --no-audit --no-fund "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"
          mkdir -p node_modules/@rolldown
          cp -R "$NATIVE_DIR/node_modules/@rolldown/binding-linux-x64-gnu" node_modules/@rolldown/
          cp -R "$NATIVE_DIR/node_modules/lightningcss-linux-x64-gnu" node_modules/
          rm -rf "$NATIVE_DIR"
          npx playwright install chromium
          npm run compile:content
      - name: Package exact-checkout workbench without Git credentials
        run: |
          mkdir -p /tmp/studio-workbench
          git archive HEAD | tar -x -C /tmp/studio-workbench
          cp -a content node_modules /tmp/studio-workbench/
          git rev-parse HEAD > /tmp/studio-workbench/WORKBENCH_CHECKOUT
          tar -czf /tmp/studio-workbench.tar.gz -C /tmp studio-workbench
          tar -czf /tmp/studio-browser.tar.gz -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v7
        with:
          name: studio-visual-workbench
          path: |
            /tmp/studio-workbench.tar.gz
            /tmp/studio-browser.tar.gz
          retention-days: 3
          compression-level: 0
