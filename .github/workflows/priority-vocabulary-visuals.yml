name: Priority Vocabulary Visual Breadth

on:
  pull_request:
    branches: [main, kidsplay]
    paths:
      - '.github/workflows/priority-vocabulary-visuals.yml'
      - 'content/vocabulary-visuals/**'
      - 'content/lexicon/open/review-wordlists/**'
      - 'content/lexicon/open/sense-review/**'
      - 'scripts/vocabulary-visuals/**'
      - 'scripts/report-vocabulary-visual-coverage.mjs'
      - 'scripts/compile-vocabulary-visual-runtime.mjs'
      - 'tests/vocabulary-visual-*.test.ts'
      - 'tests/vocabulary-semantic-scene.presentation.test.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  breadth:
    name: Compile reviewed batches and validate semantic visual breadth
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout head branch for temporary projection sync
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Linux native bindings omitted by cross-platform lockfile
        shell: bash
        run: |
          set -euo pipefail
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          TARBALL="$(npm pack --silent --pack-destination /tmp "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}" | tail -n 1)"
          mkdir -p node_modules/@rolldown/binding-linux-x64-gnu
          tar -xzf "/tmp/${TARBALL}" -C node_modules/@rolldown/binding-linux-x64-gnu --strip-components=1
          LIGHTNING_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          LIGHTNING_TARBALL="$(npm pack --silent --pack-destination /tmp "lightningcss-linux-x64-gnu@${LIGHTNING_VERSION}" | tail -n 1)"
          mkdir -p node_modules/lightningcss-linux-x64-gnu
          tar -xzf "/tmp/${LIGHTNING_TARBALL}" -C node_modules/lightningcss-linux-x64-gnu --strip-components=1
          node -e "require('@rolldown/binding-linux-x64-gnu'); require('lightningcss')"

      - name: Compile complete semantic review control plane atomically
        run: npm run compile:vocabulary-visual-batches

      - name: Prove generic batch factory, historical equivalence and determinism
        run: npm run test:vocabulary-batch-factory

      - name: Prove Phase C terminal accounting remains deterministic
        run: npx vitest run tests/vocabulary-visual-corpus-terminal.behavior.test.ts

      - name: Prove review authority, inventory and exact Phase C/runtime boundaries
        run: npx vitest run tests/vocabulary-visual-control-plane-authority.behavior.test.ts

      - name: Run semantic visual breadth acceptance suite
        run: npm run test:vocabulary-visuals

      - name: Compile exact runtime projection
        run: node scripts/compile-vocabulary-visual-runtime.mjs

      - name: Commit exact Stage A runtime projection
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/vocabulary-visuals/__generated-runtime-plans.json; then
            echo "Runtime projection already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/vocabulary-visuals/__generated-runtime-plans.json
          git commit -m "chore: sync generated vocabulary runtime projection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Prove generated artifacts do not dirty tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --short --untracked-files=all)"

      - name: Upload final live ranked priority queue
        uses: actions/upload-artifact@v7
        with:
          name: priority-vocabulary-visual-gap
          path: content/vocabulary-visuals/__generated-priority-gap.json
          if-no-files-found: error

      - name: Upload frozen reviewed-batch source queues
        uses: actions/upload-artifact@v7
        with:
          name: priority-vocabulary-review-sources
          path: content/vocabulary-visuals/__generated-priority-gap-pre-batch-*.json
          if-no-files-found: error

      - name: Upload generated reviewed semantic projections
        uses: actions/upload-artifact@v7
        with:
          name: priority-vocabulary-reviewed-batches
          path: content/vocabulary-visuals/batches/__generated-priority-*.json
          if-no-files-found: error

      - name: Upload Phase C corpus terminal dispositions
        uses: actions/upload-artifact@v7
        with:
          name: primary-vocabulary-corpus-terminal-dispositions
          path: content/vocabulary-visuals/batches/__generated-corpus-terminal-dispositions.json
          if-no-files-found: error

      - name: Upload priority human-review queue
        uses: actions/upload-artifact@v7
        with:
          name: priority-vocabulary-sense-resolution-queue
          path: content/vocabulary-visuals/__generated-priority-sense-resolution-queue.json
          if-no-files-found: error

      - name: Upload residual corpus human-review queue
        uses: actions/upload-artifact@v7
        with:
          name: primary-vocabulary-corpus-sense-resolution-queue
          path: content/vocabulary-visuals/__generated-corpus-sense-resolution-queue.json
          if-no-files-found: error
