name: Canonical Graph Migration Workbench
on:
  push:
    branches: ['refactor/canonical-learning-graph-v2']
    paths: ['scripts/learning-graph/**', 'scripts/test-*graph*.mjs', 'scripts/test-*projection*.mjs', 'scripts/test-question-semantic-targets.mjs', '.github/workflows/canonical-graph-migration.yml']
permissions:
  contents: read
concurrency:
  group: canonical-graph-migration
  cancel-in-progress: false
jobs:
  migrate-and-verify:
    if: github.repository == 'sahnishant/kidsplay' && github.ref == 'refs/heads/refactor/canonical-learning-graph-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Correct migration execution boundary and candidate-policy fixture
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replace(path, before, after) {
            let source = readFileSync(path, 'utf8');
            if (source.includes(after)) return;
            if (!source.includes(before)) throw new Error(`Patch anchor missing in ${path}`);
            writeFileSync(path, source.replace(before, after));
          }
          const path = 'scripts/learning-graph/migrations/003-semantic-traceability.mjs';
          replace(path, "import { compileObjectiveProjection } from '../objective-projection.mjs';", "import { execFileSync } from 'node:child_process';");
          replace(path, "  compileObjectiveProjection({ root, check: false });", "  execFileSync(process.execPath, ['scripts/learning-graph/objective-projection.mjs', '--write'], { cwd: root, stdio: 'inherit' });");
          const test = 'tests/bicycle-workshop-production.behavior.test.ts';
          replace(test, "it('records exact graph-claim evidence through the existing evaluator'", "it('keeps the revised unapproved functional target practice-only through the existing evaluator'");
          replace(test, "    expect(result.knowledgeEvidence.map((item) => item.rowId)).toEqual(question.knowledgeRefs);\n    expect(result.masteryEvidence.some((item) => item.conceptId === 'bicycle.braking.chain')).toBe(true);", "    expect(question.evidencePolicy).toBe('practice_only');\n    expect(question.authoring.status).toBe('draft');\n    expect(result.knowledgeEvidence).toEqual([]);\n    expect(result.masteryEvidence).toEqual([]);");
          NODE
      - name: Migrate only the reviewed graph branch
        run: |
          node scripts/learning-graph/migrations/003-semantic-traceability.mjs --write
          node scripts/learning-graph/migrations/004-exam-scope.mjs --write
          node scripts/learning-graph/migrations/003-semantic-traceability.mjs --write
          node scripts/learning-graph/migrations/004-exam-scope.mjs --write
          git restore --source=HEAD -- .github/workflows/windows-check.yml .github/workflows/browser-smoke.yml .github/workflows/android-debug.yml .github/workflows/android-stories-offline.yml
          node scripts/test-canonical-graph.mjs
          node scripts/test-objective-projection.mjs
          node scripts/test-question-semantic-targets.mjs
          node scripts/learning-graph/validate-curriculum-module.mjs --json
          node scripts/learning-graph/validate-bicycle-workshop-production.mjs --json
          node scripts/learning-graph/validate-bicycle-workshop-guided.mjs --json
          node scripts/learning-graph/validate-bicycle-workshop-exam.mjs --json
      - name: Install locked test dependencies
        run: |
          npm ci --no-audit --no-fund
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          LIGHTNINGCSS_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          NATIVE_DIR="$(mktemp -d)"
          npm install --prefix "$NATIVE_DIR" --no-save --package-lock=false --no-audit --no-fund "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"
          mkdir -p node_modules/@rolldown
          cp -R "$NATIVE_DIR/node_modules/@rolldown/binding-linux-x64-gnu" node_modules/@rolldown/
          cp -R "$NATIVE_DIR/node_modules/lightningcss-linux-x64-gnu" node_modules/
          rm -rf "$NATIVE_DIR"
      - name: Compile and run all unit regressions
        run: |
          set +e
          npm test > /tmp/graph-regression.log 2>&1
          STATUS=$?
          tail -n 160 /tmp/graph-regression.log
          exit "$STATUS"
      - name: Commit only validated migration outputs without force pushing
        run: |
          git add content/learning-graph content/learnables/bicycle-workshop.json content/learnables/bicycle-workshop-reading.json content/knowledge/bicycle-workshop-runtime-projection.json content/source-manifests/kidsplay-graph-architecture-review.json content/curriculum-modules/ncert/2026-27/class-2/english/mridang/chapters/bicycle-workshop-runtime.json content/curriculum-runtime/bicycle-workshop/questions/core.json content/experience/bicycle-workshop-guided.json content/module-assessments/mridang/bicycle-workshop-exam-v1.json scripts/learning-graph scripts/test-canonical-graph.mjs scripts/test-objective-projection.mjs scripts/compile-knowledge.mjs src/contracts/question.ts tests/canonical-learning-graph.behavior.test.ts tests/bicycle-workshop-graph-typing.behavior.test.ts tests/bicycle-workshop-production.behavior.test.ts tests/bicycle-workshop-exam.behavior.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(graph): materialize scoped functions and assessment traceability (#265)'
          git push origin HEAD:refs/heads/refactor/canonical-learning-graph-v2
          git rev-parse HEAD
