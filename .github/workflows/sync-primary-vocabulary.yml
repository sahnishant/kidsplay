name: Curate Primary Vocabulary Corpus

on:
  push:
    branches:
      - content/primary-vocabulary-corpus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primary-vocabulary-curate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curate-and-check:
    name: Refresh corpus/spelling queues and run gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Linux Rolldown binding omitted by cross-platform lockfile
        shell: bash
        run: |
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          npm install --no-save --package-lock=false "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}"

      - name: Refresh source corpus on manual sync
        if: github.event_name == 'workflow_dispatch'
        run: npm run lexicon:sync:primary

      - name: Validate committed corpus
        run: npm run validate:lexicon-corpus

      - name: Rebuild spelling/recognition review queues
        shell: bash
        run: |
          mkdir -p content/lexicon/open/review-wordlists
          find content/lexicon/open/review-wordlists -maxdepth 1 -type f -name 'grade-*-introduced-spelling.json' -delete
          npm run lexicon:select:primary -- --per-grade 400 --mode introduced --purpose spelling

      - name: Report corpus distribution
        run: npm run report:lexicon-corpus

      - name: Run vocabulary corpus and delivery acceptance tests
        run: npm run test:vocabulary-corpus

      - name: Run full Kidsplay regression check
        run: npm run check

      - name: Commit refreshed corpus and spelling queues if changed
        shell: bash
        run: |
          git add content/lexicon/open/primary-grade-corpus.json
          git add content/lexicon/open/review-wordlists/grade-*-introduced-spelling.json
          if git diff --cached --quiet; then
            echo "Primary corpus and spelling queues already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh primary vocabulary corpus and spelling queues"
          git push origin "HEAD:${GITHUB_REF_NAME}"
