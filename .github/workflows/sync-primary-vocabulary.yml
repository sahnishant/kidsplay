name: Curate Primary Vocabulary Corpus

on:
  push:
    branches:
      - content/primary-vocabulary-corpus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primary-vocabulary-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  curate-and-check:
    name: Refresh/curate corpus and run full check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh source corpus on manual sync
        if: github.event_name == 'workflow_dispatch'
        run: npm run lexicon:sync:primary

      - name: Validate committed corpus
        run: npm run validate:lexicon-corpus

      - name: Rebuild grade review queues
        shell: bash
        run: |
          rm -rf content/lexicon/open/review-wordlists
          mkdir -p content/lexicon/open/review-wordlists
          npm run lexicon:select:primary -- --per-grade 400 --mode introduced --purpose meaning
          npm run lexicon:select:primary -- --per-grade 400 --mode introduced --purpose spelling

      - name: Report corpus distribution
        run: npm run report:lexicon-corpus

      - name: Run full Kidsplay regression check
        run: npm run check

      - name: Commit refreshed corpus and review queues if changed
        shell: bash
        run: |
          git add content/lexicon/open/primary-grade-corpus.json content/lexicon/open/review-wordlists/
          if git diff --cached --quiet; then
            echo "Primary corpus and review queues already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh primary vocabulary corpus and review queues"
          git push origin "HEAD:${GITHUB_REF_NAME}"
