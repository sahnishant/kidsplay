name: Sync Primary Vocabulary Corpus

on:
  push:
    branches:
      - content/primary-vocabulary-corpus

permissions:
  contents: write

jobs:
  sync-and-check:
    name: Sync open corpus and run full check
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync compact grade corpus
        run: npm run lexicon:sync:primary

      - name: Validate compact corpus
        run: npm run validate:lexicon-corpus

      - name: Build introduction-grade review queues
        run: npm run lexicon:select:primary -- --per-grade 400 --mode introduced

      - name: Report corpus distribution
        run: npm run report:lexicon-corpus

      - name: Commit corpus and review queues if changed
        shell: bash
        run: |
          git add content/lexicon/open/primary-grade-corpus.json content/lexicon/open/review-wordlists/
          if git diff --cached --quiet; then
            echo "Corpus and review queues already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: curate primary vocabulary review queues"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run full existing validation
        run: npm run check
