name: Temporary Materialize Approved Vocabulary Batch 004

on:
  push:
    branches:
      - content/vocabulary-editorial-batch-004-prep
    paths:
      - '.github/workflows/tmp-materialize-approved-vocabulary-batch-004.yml'
      - 'content/recipes/primary-vocabulary-reviewed-delivery-batch-004.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch 004 branch
        uses: actions/checkout@v7
        with:
          ref: content/vocabulary-editorial-batch-004-prep
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Linux native bindings omitted by cross-platform lockfile
        shell: bash
        run: |
          set -euo pipefail
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          LIGHTNINGCSS_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          NATIVE_DIR="$(mktemp -d)"
          npm install --prefix "$NATIVE_DIR" --no-save --package-lock=false --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" \
            "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"
          mkdir -p node_modules/@rolldown
          rm -rf node_modules/@rolldown/binding-linux-x64-gnu node_modules/lightningcss-linux-x64-gnu
          cp -R "$NATIVE_DIR/node_modules/@rolldown/binding-linux-x64-gnu" node_modules/@rolldown/
          cp -R "$NATIVE_DIR/node_modules/lightningcss-linux-x64-gnu" node_modules/
          rm -rf "$NATIVE_DIR"

      - name: Materialize approved reviewed vocabulary production
        run: npm run compile:content

      - name: Update permanent editorial gate and SOF provenance partition
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const workflowPath = '.github/workflows/primary-vocabulary-editorial.yml';
          let workflow = readFileSync(workflowPath, 'utf8');
          const totalOld = "if (globallySeen.size !== 78) throw new Error(`Expected 78 reviewed runtime meanings across batches 001-003, got ${globallySeen.size}`);";
          const totalNew = "if (globallySeen.size !== 103) throw new Error(`Expected 103 reviewed runtime meanings across batches 001-004, got ${globallySeen.size}`);";
          if (!workflow.includes(totalOld)) throw new Error('Could not locate reviewed vocabulary total expectation');
          workflow = workflow.replace(totalOld, totalNew);

          const testOld = 'tests/vocabulary-reviewed-batch-003-production.behavior.test.ts tests/vocabulary-reviewed-concept-trace.behavior.test.ts';
          const testNew = 'tests/vocabulary-reviewed-batch-003-production.behavior.test.ts tests/vocabulary-reviewed-batch-004-production.behavior.test.ts tests/vocabulary-reviewed-concept-trace.behavior.test.ts';
          if (!workflow.includes(testOld)) throw new Error('Could not locate production test list');
          workflow = workflow.replace(testOld, testNew);

          const reviewsOld = '            content/lexicon/reviews/grade-1-batch-003.json\n            content/lexicon/reviews/grade-2-batch-003.json\n            content/knowledge/english-vocabulary-primary-reviewed.json';
          const reviewsNew = '            content/lexicon/reviews/grade-1-batch-003.json\n            content/lexicon/reviews/grade-2-batch-003.json\n            content/lexicon/reviews/grade-1-batch-004.json\n            content/lexicon/reviews/grade-2-batch-004.json\n            content/knowledge/english-vocabulary-primary-reviewed.json';
          if (!workflow.includes(reviewsOld)) throw new Error('Could not locate artifact review list');
          workflow = workflow.replace(reviewsOld, reviewsNew);

          const productionOld = '            content/knowledge/english-vocabulary-primary-reviewed-batch-003.json\n            content/learnables/primary-vocabulary-reviewed-batch-003.json\n            content/recipes/primary-vocabulary-reviewed-delivery-batch-003.json';
          const productionNew = '            content/knowledge/english-vocabulary-primary-reviewed-batch-003.json\n            content/knowledge/english-vocabulary-primary-reviewed-batch-004.json\n            content/learnables/primary-vocabulary-reviewed-batch-003.json\n            content/learnables/primary-vocabulary-reviewed-batch-004.json\n            content/recipes/primary-vocabulary-reviewed-delivery-batch-003.json\n            content/recipes/primary-vocabulary-reviewed-delivery-batch-004.json';
          if (!workflow.includes(productionOld)) throw new Error('Could not locate artifact production list');
          workflow = workflow.replace(productionOld, productionNew);
          writeFileSync(workflowPath, workflow, 'utf8');

          const membershipPath = 'content/profile-memberships/SOF_INDIA_CLASS2.json';
          const membershipText = readFileSync(membershipPath, 'utf8').replace(/\r\n/g, '\n');
          const membership = JSON.parse(membershipText);
          if (membership.members?.length !== 234) throw new Error(`Expected 234 SOF members after batch 004, got ${membership.members?.length}`);
          const gitBlobSha = (text) => createHash('sha1')
            .update(`blob ${Buffer.byteLength(text)}\0`)
            .update(text)
            .digest('hex');

          const terminalPath = 'content/alignment-terminal-reviews/SOF_INDIA_CLASS2.json';
          const terminal = JSON.parse(readFileSync(terminalPath, 'utf8'));
          terminal.reviewedAt = '2026-09-03';
          terminal.membershipSnapshot.directRowCount = 234;
          terminal.membershipSnapshot.membershipBlobSha = gitBlobSha(membershipText);
          terminal.membershipSnapshot.humanEditorialPlacementCount = 52;
          terminal.membershipSnapshot.terminalRowCount = 234;
          terminal.resolutionPolicy.humanEditorialPlacement.reviewRef = 'sof-class2-human-editorial-placement-2026-09-03';
          terminal.editorialPlacementReview.id = 'sof-class2-human-editorial-placement-2026-09-03';
          terminal.editorialPlacementReview.reviewedAt = '2026-09-03';
          terminal.editorialPlacementReview.reviewedDirectRows = 52;
          if (!terminal.editorialPlacementReview.handoffRefs.includes('content/lexicon/reviews/grade-2-batch-004.json')) {
            terminal.editorialPlacementReview.handoffRefs.push('content/lexicon/reviews/grade-2-batch-004.json');
          }
          writeFileSync(terminalPath, `${JSON.stringify(terminal, null, 2)}\n`, 'utf8');
          NODE

      - name: Prove full repository checks
        run: npm run check

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-materialize-approved-vocabulary-batch-004.yml

      - name: Commit certified production state
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(#163): publish approved vocabulary batch 004'
          git push origin HEAD:content/vocabulary-editorial-batch-004-prep
