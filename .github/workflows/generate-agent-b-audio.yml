name: Generate Agent B Audio Candidates

on:
  push:
    branches:
      - feat/bundled-voice-stories-v1
    paths:
      - scripts/generate-bundled-voice-candidates.py
      - content/stories/v1-candidates.json
      - .github/workflows/generate-agent-b-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/bundled-voice-stories-v1
          fetch-depth: 0

      - name: Install candidate voice production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg

      - name: Generate all 39 spoken candidate assets and measured evidence
        run: python3 scripts/generate-bundled-voice-candidates.py

      - name: Commit generated candidate pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/kidsplay-v1 content/audio/kidsplay-v1-candidate-manifest.json
          if git diff --cached --quiet; then
            echo "Candidate pack already matches generator output."
            exit 0
          fi
          git commit -m "Generate complete spoken Agent B candidate pack"
          git push origin HEAD:feat/bundled-voice-stories-v1
