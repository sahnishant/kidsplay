name: Repo Check Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repo-check-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore Linux native bindings
        shell: bash
        run: |
          set -euo pipefail
          ROLLDOWN_VERSION="$(node -p "require('./node_modules/rolldown/package.json').version")"
          TARBALL="$(npm pack --silent --pack-destination /tmp "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}" | tail -n 1)"
          mkdir -p node_modules/@rolldown/binding-linux-x64-gnu
          tar -xzf "/tmp/${TARBALL}" -C node_modules/@rolldown/binding-linux-x64-gnu --strip-components=1
          LIGHTNING_VERSION="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          LIGHTNING_TARBALL="$(npm pack --silent --pack-destination /tmp "lightningcss-linux-x64-gnu@${LIGHTNING_VERSION}" | tail -n 1)"
          mkdir -p node_modules/lightningcss-linux-x64-gnu
          tar -xzf "/tmp/${LIGHTNING_TARBALL}" -C node_modules/lightningcss-linux-x64-gnu --strip-components=1
      - name: Run repository check with compact failure capture
        id: check
        shell: bash
        run: |
          set +e
          npm run check > /tmp/repo-check.log 2>&1
          status=$?
          tail -n 180 /tmp/repo-check.log > repo-check-tail.log
          cat repo-check-tail.log
          exit $status
      - name: Upload compact failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repo-check-tail
          path: repo-check-tail.log
          if-no-files-found: error
